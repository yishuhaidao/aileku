<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:56px}
.header{background:#ff6b35;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}

.func-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}

.section-title{font-size:15px;font-weight:700;padding:8px 12px;display:flex;align-items:center;justify-content:space-between}

.search-bar{padding:8px 12px;background:#fff;margin:8px 12px;border-radius:20px;display:flex;align-items:center;gap:6px}
.search-bar input{flex:1;border:none;outline:none;font-size:13px;background:none}

.categories{display:flex;padding:6px 12px;gap:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}

.card-list{padding:0 12px 12px}

.menu-item .info{flex:1;display:flex;flex-direction:column;justify-content:space-between}

.menu-item .price{color:#ff6b35;font-weight:700;font-size:15px}

.qty-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}

.shop-card .sc-name{font-size:14px;font-weight:600;margin-bottom:2px}
.shop-card .sc-meta{font-size:11px;color:#999}

.shop-detail-header{background:#fff;padding:14px;margin:8px 12px;border-radius:12px;display:flex;gap:10px}
.shop-detail-header .sd-logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#ff6b35,#ff8c5a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.shop-detail-header .sd-info{flex:1}
.shop-detail-header .sd-name{font-size:16px;font-weight:600;margin-bottom:2px}
.shop-detail-header .sd-meta{font-size:11px;color:#999}
/* 鍥㈣喘鍗?*/
.deal-card{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:8px}
.deal-card .deal-body{padding:10px}
.deal-card .deal-title{font-size:14px;font-weight:600;margin-bottom:4px}
.deal-card .deal-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.deal-card .deal-tags span{padding:2px 8px;border-radius:8px;font-size:10px}

.deal-card .deal-price{color:#ff6b35}

/* 璇剧▼鍗?*/
.course-card{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:8px;display:flex;cursor:pointer}

.course-card .course-price{color:#ff6b35;font-weight:700;font-size:14px}

.course-card .price-tag{display:inline-flex;align-items:center;gap:4px}
.badge-locked{background:#ff6b35;color:#fff;font-size:9px;padding:1px 6px;border-radius:6px;margin-left:4px}
/* 鎵撹溅 */
.ride-form{padding:12px}

.ride-form .addr-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot-start{background:#4caf50}.dot-end{background:#e53935}
.ride-form .addr-item input{flex:1;border:none;outline:none;font-size:14px}
.ride-types{display:flex;gap:8px;padding:12px;overflow-x:auto}
.ride-types .rtype{background:#fff;border-radius:10px;padding:12px 16px;text-align:center;cursor:pointer;min-width:80px}
.ride-types .rtype.selected{border:2px solid #ff6b35;background:#fff8f5}
.ride-types .rtype .rt-icon{font-size:24px}
.ride-types .rtype .rt-name{font-size:12px;margin-top:4px}
.ride-types .rtype .rt-price{font-size:14px;font-weight:700;color:#ff6b35;margin-top:4px}
/* 璐墿杞?*/
.cart-bar{position:sticky;bottom:56px;background:#333;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:99}
.cart-bar .cart-info{display:flex;align-items:center;gap:8px;cursor:pointer}
.cart-bar .cart-icon{background:#ff6b35;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
.cart-bar .cart-badge{position:absolute;top:-4px;right:-4px;background:red;color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* 寮圭獥 */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}

.modal-content h3{font-size:15px;margin-bottom:10px}
/* 璁㈠崟 */
.order-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px}

.status-new{background:#fff3e0;color:#e65100}

.order-item .order-total{text-align:right;font-weight:700;color:#ff6b35}
/* 绠＄悊 */
.admin-page{padding:12px}
.admin-page h2{font-size:15px;margin:12px 0 8px}
.form-group{margin-bottom:8px}
.form-group label{display:block;font-size:12px;color:#666;margin-bottom:3px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none}
.form-group textarea{height:50px;resize:vertical}
.btn{background:#ff6b35;color:#fff;border:none;padding:8px 18px;border-radius:8px;font-size:13px;cursor:pointer;width:100%}
.btn-sm{padding:5px 12px;font-size:11px;width:auto}
.btn-outline{background:#fff;color:#ff6b35;border:1px solid #ff6b35}
.btn-danger{background:#e53935}
.btn-green{background:#4caf50}
.empty-state{text-align:center;padding:30px 15px;color:#999;font-size:13px}

/* 鎴戠殑 */
.profile-header{background:linear-gradient(135deg,#ff6b35,#ff8c5a);color:#fff;padding:24px 16px;text-align:center}
.profile-header .avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.3);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:28px}
.profile-header .nickname{font-size:16px;font-weight:600}
.profile-menu{padding:12px}
.profile-menu .menu-row{display:flex;justify-content:space-around;padding:10px 0;background:#fff;border-radius:10px;margin-bottom:8px}
.profile-menu .menu-row .m-item{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#666;cursor:pointer;gap:4px}
.profile-menu .menu-row .m-item .m-icon{font-size:22px}
/* 閰嶆柟 */
.recipe-card{background:#fff;border-radius:10px;margin-bottom:8px;overflow:hidden}
.recipe-card .rc-header{padding:10px 12px;background:linear-gradient(135deg,#ff6b35,#ff8c5a);color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer}

.recipe-card .rc-body{padding:12px;display:none}
.recipe-card .rc-body.open{display:block}

.merchant-form{padding:12px}

</style>
</head>

function navTo(p) {
  document.querySelectorAll('[id^="page-"]').forEach(e=>e.classList.add('hidden'));
  const t=document.getElementById('page-'+p); if(t) t.classList.remove('hidden');
  document.querySelectorAll('.bottom-nav .nav-item').forEach(e=>e.classList.remove('active'));
  const n=document.getElementById('nav-'+p); if(n) n.classList.add('active');

  if(p==='home') renderHome();
  else if(p==='food') renderShopList();
  else if(p==='deals'){renderDealCats();renderDeals();}
  else if(p==='ride') renderRideTypes();
  else if(p==='courses'){renderCourseCats();renderCourses();}
  else if(p==='platform-admin') renderPlatform();
  else if(p==='merchant-admin'){renderMerchantOrders();renderAdminMenu();renderAdminDeals();}
}
function switchPage(p){currentShopId=null;cart={};S('cart',cart);navTo(p);}
let prevBeforeShop = 'home';
function openShop(sid) {
  prevBeforeShop = document.querySelector('[id^="page-"]:not(.hidden)')?.id?.replace('page-','')||'home';
  currentShopId=sid; cart=L('cart',{}); S('cart',cart);
  document.querySelectorAll('[id^="page-"]').forEach(e=>e.classList.add('hidden'));
  document.getElementById('page-shop').classList.remove('hidden');
  document.querySelectorAll('.bottom-nav .nav-item').forEach(e=>e.classList.remove('active'));
  document.getElementById('nav-food').classList.add('active');
  const s=currentShop(); if(!s) return;

    </div>`;
  renderShopCats(); renderShopMenu(); updateCartBar();
}

  if(!s.deals) s.deals=[];
  const maxId=Math.max(0,...s.deals.map(d=>d.id));
  s.deals.push({id:maxId+1,name,desc:'',price,orig,cat:'缇庨',days,sold:0});
  S('shops',shops); renderAdminDeals();
  ['dealName','dealPrice','dealOrig','dealDays'].forEach(id=>document.getElementById(id).value='');
}
function renderAdminDeals(){
  const s=shops.find(s=>s.id===loggedMerchantId); if(!s||!s.deals) return;
  document.getElementById('adminDealList').innerHTML=s.deals.map(d=>`
    <div style="display:flex;align-items:center;padding:8px;border-bottom:1px solid #eee;gap:8px">
      <span style="flex:1;font-size:12px">${d.name} 鈥?楼${d.price} <span style="color:#999">鍘熉?{d.orig} 宸插敭${d.sold||0}</span></span>
      <button class="btn-sm btn-danger" onclick="removeDeal(${d.id})">鍒犻櫎</button></div>`).join('');
}
function removeDeal(id){
  const s=shops.find(s=>s.id===loggedMerchantId); if(!s||!s.deals) return;
  s.deals=s.deals.filter(d=>d.id!==id); S('shops',shops); renderAdminDeals();
}

// ========== 鍟嗗鍏ラ┗ ==========
function submitMerchant(){
  const name=document.getElementById('shopName').value.trim();
  const phone=document.getElementById('shopPhone').value.trim();
  const addr=document.getElementById('shopAddr').value.trim();
  const pwd=document.getElementById('shopPwd').value.trim();
  if(!name||!phone||!addr||!pwd){alert('璇峰～鍐欏簵閾哄熀鏈俊鎭拰瀵嗙爜');return;}
  shops.push({id:sidCounter++,name,cat:document.getElementById('shopCat').value,phone,addr,pwd,
    time:document.getElementById('shopTime').value,min:parseFloat(document.getElementById('shopMin').value)||20,
    fee:parseFloat(document.getElementById('shopFee').value)||3,status:'pending',menu:[],deals:[]});
  S('shops',shops);
  ['shopName','shopPhone','shopAddr','shopPwd','shopTime'].forEach(id=>document.getElementById(id).value='');
  alert('鎻愪氦鎴愬姛锛佸钩鍙板皢鍦?-3涓伐浣滄棩鍐呭鏍搞€?); switchPage('profile');
}

// ========== 骞冲彴绠＄悊 ==========
function addCourse(){
  const title=document.getElementById('courseTitle').value.trim();
  const desc=document.getElementById('courseDesc').value.trim();
  const price=parseFloat(document.getElementById('coursePrice').value);
  const cat=document.getElementById('courseCat').value;
  if(!title||isNaN(price)){alert('璇峰～鍐欐爣棰樺拰浠锋牸');return;}
  const maxId=Math.max(0,...courses.map(c=>c.id));
  courses.push({id:maxId+1,title,desc,price,cat});
  S('courses',courses); renderAdminCourses();
  ['courseTitle','courseDesc','coursePrice'].forEach(id=>document.getElementById(id).value='');
}
function renderAdminCourses(){
  document.getElementById('adminCourseList').innerHTML=courses.map(c=>`
    <div style="display:flex;align-items:center;padding:8px;border-bottom:1px solid #eee;gap:8px">
      <span style="flex:1;font-size:12px">${c.title} 鈥?楼${c.price} <span style="color:#999">(${c.cat})</span></span>
      <button class="btn-sm btn-danger" onclick="delCourse(${c.id})">鍒犻櫎</button></div>`).join('');
}
function delCourse(id){courses=courses.filter(c=>c.id!==id); S('courses',courses); renderAdminCourses(); renderCourses();}

function renderPlatform(){
  document.getElementById('merchantReviewList').innerHTML=shops.length===0?'<div class="empty-state">鏆傛棤鍏ラ┗鐢宠</div>':
    shops.map(s=>`<div class="order-item">
      <div><b>${s.name}</b> <span class="order-status ${s.status==='pending'?'status-new':'status-done'}">${s.status==='pending'?'寰呭鏍?:s.status==='approved'?'宸查€氳繃':'宸查┏鍥?}</span></div>
      <div style="font-size:12px;color:#666;margin:4px 0">${s.cat} 路 ${s.phone} 路 ${s.addr}</div>
      ${s.status==='pending'?`<div style="margin-top:6px">
        <button class="btn-sm btn" onclick="approveShop(${s.id})">鉁?閫氳繃</button>
        <button class="btn-sm btn-danger" onclick="rejectShop(${s.id})">鉂?椹冲洖</button></div>`:''}</div>`).join('');
  document.getElementById('statOrders').textContent=orders.length;
  document.getElementById('statRevenue').textContent='楼'+orders.filter(o=>o.status==='done').reduce((s,o)=>s+o.total,0).toFixed(2);
  document.getElementById('statShops').textContent=shops.filter(s=>s.status==='approved').length;
  renderAdminCourses();
}
function approveShop(id){const s=shops.find(s=>s.id===id); if(s){s.status='approved'; S('shops',shops); renderPlatform();}}
function rejectShop(id){shops=shops.filter(s=>s.id!==id); S('shops',shops); renderPlatform();}

// ========== 鍩庡競 ==========
const CITIES = ['鍖椾含','涓婃捣','骞垮窞','娣卞湷','鎴愰兘','鏉窞','姝︽眽','鍗椾含','閲嶅簡','瑗垮畨','閮戝窞','闀挎矙','鑻忓窞','澶╂触','闈掑矝','涓滆帪','浣涘北','鍚堣偉','绂忓窞','鍘﹂棬'];
let myCity = L('myCity', '');
function getCity(){ return myCity || '鏈畾浣?; }
function showCityPicker(){
  document.getElementById('cityGrid').innerHTML = CITIES.map(c=>`
    <div style="padding:10px;text-align:center;background:${c===myCity?'#ff6b35':'#f5f5f5'};color:${c===myCity?'#fff':'#333'};border-radius:8px;cursor:pointer;font-size:13px"
      onclick="setCity('${c}')">${c}</div>`).join('');
  document.getElementById('cityModal').classList.remove('hidden');
}
function setCity(c){
  myCity=c; S('myCity',c);
  document.getElementById('currentCity').textContent=c;
  closeModal('cityModal');
  // 鏇存柊鎵撹溅璧风偣
  const startInput = document.querySelector('#page-ride .addr-item input');
  if(startInput) startInput.value = c+'锛堣嚜鍔ㄥ畾浣嶏級';
}
function autoLocate(){
  if(myCity){ document.getElementById('currentCity').textContent=myCity; return; }
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      // 绠€鍗曞弽鎺細鐢ㄧ粡绾害绮楃暐瀵瑰簲锛堝疄闄呴渶瑕侀€嗗湴鐞嗙紪鐮丄PI锛岃繖閲屽仛绀烘剰锛?      document.getElementById('currentCity').textContent = '璇风偣鍑婚€夋嫨';
    },()=>{
      document.getElementById('currentCity').textContent = '璇风偣鍑婚€夋嫨';
    });
  } else {
    document.getElementById('currentCity').textContent = '璇风偣鍑婚€夋嫨';
  }
}

// init
autoLocate();
// 鎵撹溅椤甸粯璁よ捣鐐?setTimeout(()=>{
  const si = document.querySelector('#page-ride .addr-item input');
  if(si&&!si.value) si.value = getCity()+'锛堣嚜鍔ㄥ畾浣嶏級';
},500);
navTo('home');
</script>
