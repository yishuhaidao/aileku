<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>虾球餐饮 — 点餐小程序原型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;max-width:430px;margin:0 auto;min-height:100vh;position:relative}
/* 顶部 */
.header{background:#ff6b35;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:600}
.header .tab-switch{display:flex;gap:4px}
.header .tab-switch button{padding:6px 14px;border-radius:20px;border:none;font-size:13px;cursor:pointer}
.tab-customer{background:rgba(255,255,255,0.25);color:#fff}
.tab-admin{background:#fff;color:#ff6b35}
/* 商家头部 */
.shop-info{background:linear-gradient(135deg,#ff6b35,#ff8c5a);color:#fff;padding:20px 16px;text-align:center}
.shop-info .shop-name{font-size:22px;font-weight:700;margin-bottom:4px}
.shop-info .shop-desc{font-size:13px;opacity:0.85}
/* 搜索 */
.search-bar{padding:10px 16px;background:#fff;margin:10px 12px;border-radius:12px;display:flex;align-items:center;gap:8px}
.search-bar input{flex:1;border:none;outline:none;font-size:14px}
/* 分类 */
.categories{display:flex;padding:8px 12px;gap:8px;overflow-x:auto;white-space:nowrap}
.categories span{display:inline-block;padding:6px 16px;border-radius:16px;font-size:13px;background:#fff;cursor:pointer;flex-shrink:0}
.categories span.active{background:#ff6b35;color:#fff}
/* 菜单列表 */
.menu-list{padding:0 12px 12px}
.menu-item{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.menu-item img{width:80px;height:80px;border-radius:8px;object-fit:cover;background:#eee}
.menu-item .info{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.menu-item .name{font-size:15px;font-weight:600}
.menu-item .desc{font-size:12px;color:#999;margin-top:2px}
.menu-item .bottom{display:flex;align-items:center;justify-content:space-between}
.menu-item .price{color:#ff6b35;font-weight:700;font-size:16px}
.menu-item .price::before{content:'¥';font-size:12px}
.menu-item .add-btn{background:#ff6b35;color:#fff;border:none;width:28px;height:28px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* 购物车 */
.cart-bar{position:sticky;bottom:0;background:#333;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:100}
.cart-bar .cart-info{display:flex;align-items:center;gap:10px}
.cart-bar .cart-icon{background:#ff6b35;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative}
.cart-bar .cart-badge{position:absolute;top:-4px;right:-4px;background:red;color:#fff;font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cart-bar .total{font-size:18px;font-weight:700}
.cart-bar .checkout{background:#ff6b35;color:#fff;border:none;padding:10px 24px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer}
/* 弹窗 */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-content{background:#fff;width:100%;max-width:430px;border-radius:16px 16px 0 0;padding:20px;max-height:80vh;overflow-y:auto}
.modal-content h3{font-size:16px;margin-bottom:12px}
/* 订单列表 */
.order-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px}
.order-item .order-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;color:#999}
.order-item .order-status{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.status-new{background:#fff3e0;color:#e65100}
.status-done{background:#e8f5e9;color:#2e7d32}
.order-item .order-items{font-size:14px;margin:4px 0}
.order-item .order-total{text-align:right;font-weight:700;color:#ff6b35}
/* 管理页面 */
.admin-page{padding:12px}
.admin-page h2{font-size:16px;margin:12px 0 8px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.form-group textarea{height:60px;resize:vertical}
.btn{background:#ff6b35;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;width:100%}
.btn-sm{padding:6px 14px;font-size:12px;width:auto}
.btn-outline{background:#fff;color:#ff6b35;border:1px solid #ff6b35}
.btn-danger{background:#e53935}
.empty-state{text-align:center;padding:40px 20px;color:#999}
/* tab切换隐藏 */
.hidden{display:none!important}
/* 数量加减 */
.qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-ctrl button{width:24px;height:24px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:14px;cursor:pointer}
.qty-ctrl span{font-size:14px;min-width:20px;text-align:center}
/* 视频区 */
.video-card{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px}
.video-card .video-thumb{width:100%;height:160px;background:#333;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;cursor:pointer}
.video-card .video-info{padding:10px 12px}
.video-card .video-title{font-size:14px;font-weight:600;margin-bottom:4px}
.video-card .video-meta{font-size:12px;color:#999}
/* 配方 */
.recipe-card{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden}
.recipe-card .rc-header{padding:12px;background:linear-gradient(135deg,#ff6b35,#ff8c5a);color:#fff;display:flex;justify-content:space-between;align-items:center}
.recipe-card .rc-header .rc-name{font-size:16px;font-weight:700}
.recipe-card .rc-header .rc-tag{background:rgba(255,255,255,0.25);padding:2px 10px;border-radius:10px;font-size:11px}
.recipe-card .rc-body{padding:12px}
.recipe-card .rc-body h4{font-size:13px;color:#ff6b35;margin:8px 0 4px}
.recipe-card .rc-body p{font-size:13px;line-height:1.8;color:#333}
.recipe-card .rc-body .rc-note{font-size:12px;color:#999;margin-top:8px;padding:8px;background:#fff8f5;border-radius:8px}
.recipe-tabs{display:flex;gap:8px;padding:8px 12px;overflow-x:auto}
.recipe-tabs span{display:inline-block;padding:6px 16px;border-radius:16px;font-size:13px;background:#fff;cursor:pointer;flex-shrink:0}
.recipe-tabs span.active{background:#ff6b35;color:#fff}
</style>
</head>
<body>

<!-- ========== 用户端 ========== -->
<div id="customerView">

  <div class="header">
    <h1>🍤 虾球餐饮</h1>
    <div class="tab-switch">
      <button class="tab-customer" onclick="switchView('customer')">点餐</button>
      <button class="tab-customer" onclick="switchView('recipe')">配方</button>
      <button class="tab-customer" onclick="switchView('admin')">管理</button>
    </div>
  </div>

  <div class="shop-info">
    <div class="shop-name">虾球小厨</div>
    <div class="shop-desc">🔥 现炒现做 · 30分钟送达 · 品质保证</div>
  </div>

  <div class="search-bar">
    <span>🔍</span>
    <input type="text" placeholder="搜索菜品..." oninput="filterMenu(this.value)">
  </div>

  <div class="categories" id="categoryBar"></div>
  <div class="menu-list" id="menuList"></div>

  <div class="cart-bar" id="cartBar">
    <div class="cart-info" onclick="showCart()">
      <div class="cart-icon">🛒<span class="cart-badge" id="cartCount" style="display:none">0</span></div>
      <div style="color:#999;font-size:13px;">查看购物车</div>
    </div>
    <div class="total" id="cartTotal">¥0</div>
    <button class="checkout" onclick="checkout()">去结算</button>
  </div>

</div>

<!-- ========== 配方页 ========== -->
<div id="recipeView" class="hidden">
  <div class="header">
    <h1>📖 鲜吃配方</h1>
    <div class="tab-switch">
      <button class="tab-customer" onclick="switchView('customer')">点餐</button>
      <button class="tab-admin" onclick="switchView('recipe')">配方</button>
      <button class="tab-customer" onclick="switchView('admin')">管理</button>
    </div>
  </div>
  <div class="recipe-tabs" id="recipeTabs"></div>
  <div id="recipeList" style="padding:0 12px 12px"></div>
</div>

<!-- ========== 商家管理端 ========== -->
<div id="adminView" class="hidden">
  <div class="header">
    <h1>⚙️ 商家管理</h1>
    <div class="tab-switch">
      <button class="tab-admin" onclick="switchView('customer')">点餐</button>
      <button class="tab-customer" onclick="switchView('admin')">管理</button>
    </div>
  </div>
  <div class="admin-page">
    <h2>📋 今日订单</h2>
    <div id="orderList"></div>

    <h2>📝 添加菜品</h2>
    <div class="form-group"><label>菜名</label><input type="text" id="newName" placeholder="如：宫保鸡丁"></div>
    <div class="form-group"><label>描述</label><input type="text" id="newDesc" placeholder="简单描述这道菜..."></div>
    <div class="form-group"><label>价格 (元)</label><input type="number" id="newPrice" placeholder="0.00" step="0.01"></div>
    <div class="form-group"><label>分类</label>
      <select id="newCat">
        <option value="热菜">热菜</option>
        <option value="凉菜">凉菜</option>
        <option value="主食">主食</option>
        <option value="饮品">饮品</option>
        <option value="小吃">小吃</option>
      </select>
    </div>
    <div class="form-group"><label>图片URL (可选)</label><input type="text" id="newImg" placeholder="http://..."></div>
    <button class="btn" onclick="addMenuItem()">✅ 添加菜品</button>

    <h2>📦 已有菜品</h2>
    <div id="adminMenuList"></div>
  </div>
</div>

<!-- 购物车弹窗 -->
<div id="cartModal" class="modal hidden">
  <div class="modal-content">
    <h3>🛒 购物车 <span style="float:right;cursor:pointer" onclick="closeModal('cartModal')">✕</span></h3>
    <div id="cartItems"></div>
    <div style="text-align:right;font-size:18px;font-weight:700;color:#ff6b35;margin:12px 0" id="modalTotal">合计: ¥0</div>
    <button class="btn" onclick="checkout()">立即下单</button>
  </div>
</div>

<!-- 下单弹窗 -->
<div id="orderModal" class="modal hidden">
  <div class="modal-content">
    <h3>📝 确认下单</h3>
    <div id="orderSummary"></div>
    <div class="form-group"><label>联系人</label><input type="text" id="orderName" placeholder="姓名"></div>
    <div class="form-group"><label>手机号</label><input type="tel" id="orderPhone" placeholder="手机号"></div>
    <div class="form-group"><label>备注</label><textarea id="orderNote" placeholder="如：不要辣、多放葱..."></textarea></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline" onclick="closeModal('orderModal')" style="width:50%">取消</button>
      <button class="btn" onclick="submitOrder()" style="width:50%">确认下单</button>
    </div>
  </div>
</div>

<!-- 视频学习弹窗 -->
<div id="videoSection" style="padding:12px;margin-top:10px">
  <div style="font-size:16px;font-weight:600;margin-bottom:8px">📚 新手开店教程</div>
  <div id="videoList"></div>
</div>

<script>
// ============ 数据管理 ============
function loadData(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; }
  catch(e) { return fallback; }
}
function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

// 默认菜单
const defaultMenu = [
  {id:1,name:'宫保鸡丁',desc:'鸡肉丁配花生米，香辣可口',price:28,category:'热菜',img:''},
  {id:2,name:'麻婆豆腐',desc:'麻辣鲜香，超下饭',price:18,category:'热菜',img:''},
  {id:3,name:'拍黄瓜',desc:'清爽解腻，蒜香十足',price:12,category:'凉菜',img:''},
  {id:4,name:'蛋炒饭',desc:'粒粒分明，经典主食',price:15,category:'主食',img:''},
  {id:5,name:'酸梅汤',desc:'冰镇解渴，夏日必点',price:8,category:'饮品',img:''},
  {id:6,name:'炸鸡翅',desc:'外酥里嫩，一口一个',price:22,category:'小吃',img:''},
  {id:7,name:'红烧肉',desc:'肥而不腻，入口即化',price:38,category:'热菜',img:''},
  {id:8,name:'番茄鸡蛋面',desc:'家常味，满满一碗',price:16,category:'主食',img:''},
];

// 配方数据库
const recipeData = [
  {cat:'凉拌/捞汁', recipes:[
    {name:'捞汁小海鲜',tag:'比尔盖南',ingredients:'虾、花蛤、蛏子、鱿鱼（任选3-4样）\n蒜末30g、小米辣15g、香菜20g、柠檬半个\n生抽50ml、香醋30ml、蚝油20g、白糖15g\n香油10ml、纯净水100ml',steps:`1. 海鲜洗净，虾去虾线，鱿鱼切圈\n2. 水烧开加姜片料酒，海鲜分别焯熟（虾2分钟/花蛤开口/鱿鱼卷起）\n3. 焯好后立即冰水过凉，沥干\n4. 调捞汁：生抽+香醋+蚝油+糖+香油+纯净水搅匀\n5. 加入蒜末、小米辣、香菜、柠檬片\n6. 海鲜浸入捞汁，冷藏腌2小时以上\n7. 出餐时捞出来，撒芝麻和葱花`,note:'成本约8-12元/份，售价28-38元。冷藏保存可放24小时。'},
    {name:'蒜泥白肉',tag:'经典凉菜',ingredients:'五花肉500g\n蒜泥30g、辣椒油30ml\n生抽20ml、香醋15ml、白糖10g\n花椒粉2g、香油5ml、黄瓜一根',steps:`1. 五花肉冷水下锅，加姜葱料酒，煮开后转小火煮30分钟至筷子能插入\n2. 捞出晾凉，切成薄片（越薄越好）\n3. 黄瓜切丝垫盘底，肉片码在上面\n4. 调料汁：蒜泥+生抽+香醋+糖+花椒粉+辣椒油+香油搅匀\n5. 淋上料汁，撒葱花`,note:'成本约6-8元/份，售价22-28元。肉片一定要薄，厚了腻。'},
    {name:'口水鸡',tag:'招牌必点',ingredients:'鸡腿2个\n黄瓜半根、花生碎20g\n红油30ml、生抽20ml、香醋15ml、白糖10g\n花椒粉3g、芝麻酱15g、蒜水30ml',steps:`1. 鸡腿冷水下锅，加姜葱料酒，煮开后转小火煮20分钟\n2. 关火焖10分钟，捞出冰水浸泡（皮才脆）\n3. 手撕成条，黄瓜切丝垫底，鸡肉码上\n4. 调料汁：芝麻酱+生抽+醋+糖+花椒粉+红油+蒜水搅匀\n5. 淋料汁，撒花生碎和葱花`,note:'成本约7元/份，售价28-35元。焖10分钟是让鸡皮脆的关键。'},
  ]},
  {cat:'卤味/炖煮', recipes:[
    {name:'商业五香卤水（通用基底）',tag:'配方核心',ingredients:`香料包：八角15g、桂皮10g、香叶5g\n花椒10g、丁香3g、草果2个、白芷8g\n陈皮5g、小茴香10g、甘草5g\n卤水：老抽80ml、生抽150ml\n盐60g、冰糖80g、姜片50g、葱段50g\n料酒50ml、水3000ml\n（另备冰糖60g炒糖色用）`,steps:`1. 所有香料装纱布袋，温水泡10分钟去苦\n2. 锅里加少许油，小火炒60g冰糖至棕红色冒小泡（糖色）\n3. 立刻倒入3000ml开水（小心溅），加香料包\n4. 加老抽、生抽、盐、80g冰糖、姜葱、料酒\n5. 大火烧开转小火熬30分钟，卤水即成\n6. 肉类焯水后入卤水，中小火卤：鸡腿20分钟/猪蹄40分钟/牛肉60分钟\n7. 关火浸泡30分钟以上入味`,note:'此卤水可反复使用，越用越香。每天烧开一次防止变馊。卤豆制品需另起小锅防止坏卤。'},
    {name:'五香茶叶蛋',tag:'比尔盖南',ingredients:'鸡蛋20个\n红茶/普洱茶15g\n八角5个、桂皮1段、香叶5片、花椒5g\n盐30g、生抽80ml、老抽20ml、冰糖20g',steps:`1. 鸡蛋冷水下锅，煮开后煮8分钟\n2. 捞出用勺子敲裂蛋壳（裂纹均匀，不要敲碎）\n3. 水2000ml+茶叶+香料+盐+生抽+老抽+冰糖，烧开\n4. 放入敲好的蛋，小火煮20分钟\n5. 关火浸泡，至少4小时（建议过夜）\n6. 出餐前加热即可`,note:'成本约0.8元/个，售价2.5-3元。浸泡时间越长越入味，冬天保温桶出摊最佳。'},
  ]},
  {cat:'油炸小吃', recipes:[
    {name:'街边炸鸡叉骨',tag:'爆款单品',ingredients:'鸡叉骨（锁骨）1000g\n腌制料：盐12g、白糖15g、味精5g\n五香粉5g、辣椒粉8g、蒜粉5g\n姜粉3g、鸡蛋1个、淀粉30g\n裹粉：面粉200g+淀粉100g+泡打粉3g',steps:`1. 鸡叉骨解冻洗净，用厨房纸吸干\n2. 拌入所有腌制料+鸡蛋+淀粉，抓匀腌2小时（最好过夜）\n3. 裹粉混合均匀，腌好的鸡叉骨逐个沾粉、抖掉余粉\n4. 油温170℃（筷子冒小泡），下锅炸4-5分钟至金黄\n5. 捞出沥油，撒孜然辣椒粉\n6. 出餐称重，8元/份起`,note:'成本约3元/份，售价8-12元。油温要稳，低了吸油高了外焦里生。'},
    {name:'脆皮炸鸡腿',tag:'经典年销',ingredients:'大鸡腿6个\n腌料：牛奶200ml+盐12g+黑胡椒3g+蒜粉5g\n裹粉：面粉200g+玉米淀粉80g+泡打粉4g\n盐5g+黑胡椒3g+辣椒粉5g\n（裹粉中取少量，加少量水搅成小颗粒，混回）',steps:`1. 鸡腿用叉子扎孔，腌入牛奶混合料，冷藏4小时以上\n2. 裹粉全部混合，从中取少许加水搅成小团，捏碎混回（形成脆鳞关键）\n3. 鸡腿从腌料中捞出不沥干，直接沾粉，用手按压紧实\n4. 油温165℃，中小火炸12-15分钟（内部熟透）\n5. 捞出沥油，撒调味粉`,note:'成本约5元/个，售价15-18元。裹粉里提前做出湿颗粒是酥脆鳞片的关键。'},
    {name:'炸薯条（商用版）',tag:'配餐利器',ingredients:'大土豆或冷冻直切薯条\n浸泡水：清水+白醋少许\n调味盐：盐5g+糖2g+蒜粉1g（混合磨粉）',steps:`1. 土豆切1cm粗条，清水浸泡30分钟去淀粉\n2. 换水加少许白醋，再泡15分钟\n3. 沸水焯2分钟，捞出沥干放凉\n4. 冰箱冷冻2小时以上（可长期储存）\n5. 油温180℃，直接下冷冻薯条炸3-4分钟至金黄\n6. 撒调味盐，摇匀`,note:'成本约2元/份，售价8-10元。冷冻是让薯条外酥里嫩的关键步骤，可批量备货。'},
  ]},
  {cat:'主食/粉面', recipes:[
    {name:'酸辣粉（商用配方）',tag:'摆摊必备',ingredients:'红薯粉条150g（提前泡软）\n蒜水20ml、生抽15ml、陈醋20ml、辣椒油20ml\n花椒粉2g、白糖5g、味精3g、盐2g\n鸡汤或骨汤200ml\n油炸花生碎15g、榨菜碎15g、香菜葱花',steps:`1. 碗底调汁：蒜水+生抽+陈醋+辣椒油+花椒粉+糖+味精+盐\n2. 沸水烫粉条30秒捞出，入碗\n3. 浇热汤200ml\n4. 撒花生碎、榨菜碎、香菜葱花\n5. 搅匀即食`,note:'成本约2.5元/碗，售价8-12元。提前批量调好料粉，出餐速度30秒。'},
    {name:'葱油拌面',tag:'低成本高利润',ingredients:'细面150g\n葱油：小葱200g切段+食用油300ml（小火熬至葱变焦黄）\n料汁：生抽30ml+老抽10ml+白糖15g（加热融化）',steps:`1. 冷油放入葱段，中小火慢熬，经常搅动\n2. 熬至葱变深棕色（约15分钟），捞出焦葱\n3. 料汁微火加热至糖融化，倒入葱油中搅匀\n4. 煮面：水开下面，煮2分钟断生捞出\n5. 沥干入碗，淋2勺葱油料汁，拌匀\n6. 可加煎蛋、卤蛋增加客单价`,note:'成本约2元/碗（含面+葱油），售价8-10元。葱油一次熬多些可用一周，油亮焦香。'},
  ]},
  {cat:'网红饮品', recipes:[
    {name:'柠檬冰红茶（商用配方）',tag:'夏季爆款',ingredients:'立顿红茶包10包或红茶叶30g、水2000ml\n白砂糖180-200g（可调）\n柠檬2个（榨汁+切片装饰用）\n冰块若干',steps:`1. 水烧开，关火放入红茶包/茶叶，焖5分钟\n2. 捞出茶包/滤掉茶叶\n3. 趁热加糖搅拌至全融化\n4. 放凉后挤入柠檬汁，搅匀\n5. 冷藏保存。出餐：杯中加冰块+柠檬红茶+柠檬片1片`,note:'成本约0.8元/杯，售价5-8元。500ml杯装满冰，茶液成本极低。夏天一天能卖50杯。'},
    {name:'冰镇酸梅汤',tag:'解腻神器',ingredients:'乌梅30g、山楂干20g、陈皮10g\n甘草5g、洛神花5g（增色）\n冰糖150g、桂花少许\n水2500ml',steps:`1. 所有药材过水冲洗（不要泡）\n2. 入锅加水2500ml，大火烧开转小火熬40分钟\n3. 滤出汤汁，加冰糖搅化\n4. 药渣再加1000ml水，再熬20分钟\n5. 两次汤汁合并，放凉冷藏\n6. 出餐加冰块撒桂花`,note:'成本约1.5元/杯（含药材+桂花），售价6-10元。洛神花是酸梅汤颜色红亮的关键。'},
  ]},
];
let activeRecipeCat = '凉拌/捞汁';

// 实用教程
const defaultVideos = [
  {title:'📖 开店第一步：上传菜品',desc:'打开管理后台 → 填写菜名、描述、价格 → 点添加。顾客端立刻能看到。',detail:'<b>操作步骤：</b><br>1. 点右上角「管理」进入后台<br>2. 在「添加菜品」区填菜名、描述、价格<br>3. 选分类（热菜/凉菜/主食等）<br>4. 点「添加菜品」即可<br><br><b>技巧：</b>菜名要清晰（如"宫保鸡丁"而不是"特色菜1"），价格用整数更好看。',icon:'📝'},
  {title:'📋 第二步：管理订单',desc:'顾客下单后 → 后台立刻显示 → 点「标记完成」通知顾客。',detail:'<b>订单流程：</b><br>1. 顾客在前端选菜下单<br>2. 后台「今日订单」立即显示<br>3. 点击「标记完成」完成订单<br><br><b>注意：</b>及时处理订单，建议设置手机提醒。所有订单信息保存在浏览器中。',icon:'📦'},
  {title:'💰 如何定价赚钱',desc:'成本×2.5=售价。一份成本10元的菜，卖25元才有利润。',detail:'<b>定价公式：</b><br>售价 = 食材成本 × 2.5~3<br><br>举例：<br>• 食材成本8元 → 卖20~24元<br>• 食材成本15元 → 卖38~45元<br><br><b>为什么×2.5？</b><br>剩下的覆盖：房租、人工、水电、包装、平台抽成。×3更安全。',icon:'💡'},
  {title:'📱 如何让顾客找到你',desc:'微信分享链接、朋友圈发菜单截图、周边小区发传单。',detail:'<b>推广三步走：</b><br>1. 把小程序链接发到小区群、写字楼群<br>2. 截图菜单发朋友圈，配文荐菜<br>3. 开业前三天打折（如8折），吸引第一批顾客<br><br><b>关键：</b>前10个顾客体验好，他们会帮你转发。',icon:'📢'},
  {title:'🔧 常见问题',desc:'下单没反应？页面空白？数据丢了？来看解决方法。',detail:'<b>Q: 页面打不开？</b><br>A: 检查网络，换成WiFi试试。<br><br><b>Q: 加的菜品不见了？</b><br>A: 数据存在手机浏览器里，换手机看不到。同一部手机永久保存。<br><br><b>Q: 怎么接入微信支付？</b><br>A: 需要注册微信小程序（300元/年认证费），加上后端服务器。当前版本先跑通流程。',icon:'❓'},
];

let menu = loadData('food_menu', defaultMenu);
let orders = loadData('food_orders', []);
let cart = loadData('food_cart', {});
let nextId = menu.length > 0 ? Math.max(...menu.map(m=>m.id)) + 1 : 1;
let orderNextId = orders.length > 0 ? Math.max(...orders.map(o=>o.id)) + 1 : 1;

// ============ 渲染 ============
function getCategories() {
  return [...new Set(menu.map(m=>m.category))];
}

function renderCategories() {
  const cats = getCategories();
  const bar = document.getElementById('categoryBar');
  bar.innerHTML = '<span class="active" onclick="filterByCat(\'全部\')">全部</span>';
  cats.forEach(c => {
    bar.innerHTML += `<span onclick="filterByCat('${c}')">${c}</span>`;
  });
}

let activeCat = '全部';
let searchTerm = '';

function filterByCat(cat) {
  activeCat = cat;
  document.querySelectorAll('#categoryBar span').forEach(s => {
    s.classList.toggle('active', s.textContent === cat);
  });
  renderMenu();
}

function filterMenu(term) {
  searchTerm = term.toLowerCase();
  renderMenu();
}

function renderMenu() {
  const list = document.getElementById('menuList');
  let items = menu.filter(m => {
    const matchCat = activeCat === '全部' || m.category === activeCat;
    const matchSearch = !searchTerm || m.name.toLowerCase().includes(searchTerm) || m.desc.toLowerCase().includes(searchTerm);
    return matchCat && matchSearch;
  });
  list.innerHTML = items.map(m => `
    <div class="menu-item">
      <img src="${m.img || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"80\" height=\"80\"><rect fill=\"%23eee\" width=\"80\" height=\"80\"/><text fill=\"%23999\" font-size=\"11\" y=\"45\" text-anchor=\"middle\" x=\"40\">暂无图片</text></svg>')}" alt="${m.name}">
      <div class="info">
        <div>
          <div class="name">${m.name}</div>
          <div class="desc">${m.desc}</div>
        </div>
        <div class="bottom">
          <span class="price">${m.price}</span>
          ${cart[m.id] ? 
            `<div class="qty-ctrl">
              <button onclick="changeQty(${m.id},-1)">−</button>
              <span>${cart[m.id]}</span>
              <button onclick="changeQty(${m.id},1)">+</button>
            </div>` :
            `<button class="add-btn" onclick="changeQty(${m.id},1)">+</button>`
          }
        </div>
      </div>
    </div>
  `).join('');
}

function changeQty(itemId, delta) {
  const item = menu.find(m => m.id === itemId);
  if (!item) return;
  cart[itemId] = (cart[itemId] || 0) + delta;
  if (cart[itemId] <= 0) delete cart[itemId];
  saveData('food_cart', cart);
  updateCartBar();
  renderMenu();
}

function updateCartBar() {
  const totalItems = Object.values(cart).reduce((s,q) => s+q, 0);
  const totalPrice = Object.entries(cart).reduce((s,[id,q]) => {
    const item = menu.find(m => m.id === parseInt(id));
    return s + (item ? item.price * q : 0);
  }, 0);
  document.getElementById('cartCount').textContent = totalItems;
  document.getElementById('cartCount').style.display = totalItems > 0 ? '' : 'none';
  document.getElementById('cartTotal').textContent = '¥' + totalPrice.toFixed(2);
}

function showCart() {
  const modal = document.getElementById('cartModal');
  const items = document.getElementById('cartItems');
  if (Object.keys(cart).length === 0) {
    items.innerHTML = '<div class="empty-state">购物车空空如也 🛒</div>';
  } else {
    items.innerHTML = Object.entries(cart).map(([id,q]) => {
      const item = menu.find(m => m.id === parseInt(id));
      return item ? `
        <div style="display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #eee">
          <span style="flex:1;font-size:14px">${item.name} × ${q}</span>
          <span style="color:#ff6b35;font-weight:700;margin-right:12px">¥${(item.price*q).toFixed(2)}</span>
          <button onclick="changeQty(${id},-${q});closeModal('cartModal');showCart()" style="background:none;border:none;color:#999;cursor:pointer;font-size:16px">&times;</button>
        </div>
      ` : '';
    }).join('');
  }
  const totalPrice = Object.entries(cart).reduce((s,[id,q]) => {
    const item = menu.find(m => m.id === parseInt(id));
    return s + (item ? item.price * q : 0);
  }, 0);
  document.getElementById('modalTotal').textContent = '合计: ¥' + totalPrice.toFixed(2);
  modal.classList.remove('hidden');
}

function checkout() {
  if (Object.keys(cart).length === 0) { alert('购物车是空的'); return; }
  closeModal('cartModal');
  const summary = Object.entries(cart).map(([id,q]) => {
    const item = menu.find(m => m.id === parseInt(id));
    return item ? `<div>${item.name} × ${q} — ¥${(item.price*q).toFixed(2)}</div>` : '';
  }).join('');
  const total = Object.entries(cart).reduce((s,[id,q]) => {
    const item = menu.find(m => m.id === parseInt(id));
    return s + (item ? item.price * q : 0);
  }, 0);
  document.getElementById('orderSummary').innerHTML = summary + `<div style="font-weight:700;margin-top:8px;color:#ff6b35">总计: ¥${total.toFixed(2)}</div>`;
  document.getElementById('orderModal').classList.remove('hidden');
}

function submitOrder() {
  const name = document.getElementById('orderName').value.trim();
  const phone = document.getElementById('orderPhone').value.trim();
  if (!name || !phone) { alert('请填写联系人和手机号'); return; }
  const items = Object.entries(cart).map(([id,q]) => {
    const item = menu.find(m => m.id === parseInt(id));
    return { name: item?.name || '未知', price: item?.price || 0, qty: q };
  });
  const total = items.reduce((s,i) => s + i.price * i.qty, 0);
  const order = {
    id: orderNextId++,
    items, total,
    contact: name, phone,
    note: document.getElementById('orderNote').value,
    time: new Date().toLocaleString('zh-CN'),
    status: 'new'
  };
  orders.unshift(order);
  saveData('food_orders', orders);
  cart = {};
  saveData('food_cart', cart);
  updateCartBar();
  renderMenu();
  closeModal('orderModal');
  alert('下单成功！商家会尽快处理 📦');
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

// ============ 管理端 ============
function renderOrders() {
  const list = document.getElementById('orderList');
  if (orders.length === 0) {
    list.innerHTML = '<div class="empty-state">暂无订单</div>';
    return;
  }
  list.innerHTML = orders.map(o => `
    <div class="order-item">
      <div class="order-header">
        <span>#${o.id} ${o.time}</span>
        <span class="order-status ${o.status==='new'?'status-new':'status-done'}">${o.status==='new'?'待处理':'已完成'}</span>
      </div>
      <div class="order-items">${o.items.map(i=>`${i.name}×${i.qty}`).join('、')}</div>
      <div>${o.contact} · ${o.phone}${o.note ? ' · '+o.note : ''}</div>
      <div class="order-total">¥${o.total.toFixed(2)}</div>
      ${o.status==='new' ? `<div style="margin-top:6px">
        <button class="btn-sm btn" onclick="completeOrder(${o.id})">✅ 标记完成</button>
      </div>` : ''}
    </div>
  `).join('');
}

function completeOrder(id) {
  const order = orders.find(o => o.id === id);
  if (order) { order.status = 'done'; saveData('food_orders', orders); renderOrders(); }
}

function addMenuItem() {
  const name = document.getElementById('newName').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  const price = parseFloat(document.getElementById('newPrice').value);
  const category = document.getElementById('newCat').value;
  const img = document.getElementById('newImg').value.trim();
  if (!name || isNaN(price) || price <= 0) { alert('请填写菜名和价格'); return; }
  menu.push({ id: nextId++, name, desc, price, category, img });
  saveData('food_menu', menu);
  ['newName','newDesc','newPrice','newImg'].forEach(id => document.getElementById(id).value = '');
  renderAdminMenu();
  renderCategories();
  renderMenu();
}

function deleteItem(id) {
  if (!confirm('确定删除吗？')) return;
  menu = menu.filter(m => m.id !== id);
  saveData('food_menu', menu);
  renderAdminMenu();
  renderCategories();
  renderMenu();
}

function renderAdminMenu() {
  const list = document.getElementById('adminMenuList');
  list.innerHTML = menu.map(m => `
    <div style="display:flex;align-items:center;padding:8px;border-bottom:1px solid #eee;gap:8px">
      <span style="flex:1;font-size:13px">${m.name} — ¥${m.price} <span style="color:#999">(${m.category})</span></span>
      <button class="btn-sm btn-danger" onclick="deleteItem(${m.id})">删除</button>
    </div>
  `).join('');
}

function renderVideos() {
  document.getElementById('videoList').innerHTML = defaultVideos.map((v,i) => `
    <div class="video-card" style="padding:14px">
      <div style="font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer" onclick="toggleTutorial(${i})">
        <span style="font-size:24px">${v.icon||'📖'}</span>
        <span>${v.title}</span>
      </div>
      <div style="font-size:13px;color:#666;margin:6px 0 0 32px">${v.desc}</div>
      <div class="tutorial-detail" id="tutorial-${i}" style="display:none;margin:10px 0 0 32px;padding:12px;background:#f9f9f9;border-radius:8px;font-size:13px;line-height:1.8">
        ${v.detail}
      </div>
    </div>
  `).join('');
}

function toggleTutorial(i) {
  const el = document.getElementById('tutorial-'+i);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ============ 配方渲染 ============
function renderRecipeTabs() {
  const tabs = document.getElementById('recipeTabs');
  tabs.innerHTML = recipeData.map(c => 
    `<span class="${c.cat===activeRecipeCat?'active':''}" onclick="switchRecipeCat('${c.cat}')">${c.cat}</span>`
  ).join('');
}

function switchRecipeCat(cat) {
  activeRecipeCat = cat;
  renderRecipeTabs();
  renderRecipes();
}

function renderRecipes() {
  const list = document.getElementById('recipeList');
  const cat = recipeData.find(c => c.cat === activeRecipeCat);
  if (!cat) { list.innerHTML = '<div class="empty-state">暂无配方</div>'; return; }
  list.innerHTML = cat.recipes.map(r => `
    <div class="recipe-card">
      <div class="rc-header">
        <span class="rc-name">${r.name}</span>
        <span class="rc-tag">${r.tag}</span>
      </div>
      <div class="rc-body">
        <h4>🥬 食材清单</h4>
        <p style="white-space:pre-line">${r.ingredients}</p>
        <h4>👨‍🍳 制作步骤</h4>
        <p style="white-space:pre-line">${r.steps}</p>
        <div class="rc-note">💡 ${r.note}</div>
      </div>
    </div>
  `).join('');
}

// ============ 视图切换 ============
function switchView(view) {
  const c = document.getElementById('customerView');
  const r = document.getElementById('recipeView');
  const a = document.getElementById('adminView');
  c.classList.add('hidden'); r.classList.add('hidden'); a.classList.add('hidden');
  if (view === 'recipe') { r.classList.remove('hidden'); renderRecipeTabs(); renderRecipes(); }
  else if (view === 'admin') { a.classList.remove('hidden'); renderOrders(); renderAdminMenu(); }
  else { c.classList.remove('hidden'); renderMenu(); renderCategories(); updateCartBar(); }
  // 更新tab按钮样式
  document.querySelectorAll('.header .tab-switch button').forEach(b => {
    b.classList.remove('tab-admin'); b.classList.add('tab-customer');
  });
  const targetBtn = Array.from(document.querySelectorAll('.header .tab-switch button'))
    .find(b => b.textContent.trim() === (view==='customer'?'点餐':view==='recipe'?'配方':'管理'));
  if (targetBtn) { targetBtn.classList.remove('tab-customer'); targetBtn.classList.add('tab-admin'); }
}

// 初始化
renderMenu();
renderCategories();
renderVideos();
updateCartBar();
</script>
</body>
</html>
